spring.application.name=spark
spring.datasource.url=jdbc:oracle:thin:@192.168.1.153:1521/gib
spring.datasource.username=SPARK
spring.datasource.password=s

# DISABLE ALL HIBERNATE DDL OPERATIONS
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.hbm2ddl.import_files=
spring.sql.init.mode=never

spring.jpa.show-sql=true
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Springdoc OpenAPI configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# springdoc.packages-to-scan kept broader by default; previous value narrowed scan and hid controllers.
# springdoc.packages-to-scan=com.mislbd.spark.controller
# Limit to /api/** only if every controller mapping starts with /api . Narrow filter previously hid endpoints.
# springdoc.paths-to-match=/api/**
# Optional: keep default UI path at /swagger-ui.html
# springdoc.swagger-ui.path=/swagger-ui.html

# Debug logging to diagnose 500 on /v3/api-docs/api
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=INFO
