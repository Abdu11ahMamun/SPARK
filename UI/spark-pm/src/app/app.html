<div class="app-layout" [class.fullscreen-login]="!showLayout()">
  <app-sidebar *ngIf="showLayout()" (sidebarToggled)="onSidebarToggled($event)"></app-sidebar>
  <main class="main-content" [class.sidebar-collapsed]="sidebarCollapsed()" [class.fullscreen]="!showLayout()">
    <router-outlet />
  </main>
  <app-notifications *ngIf="showLayout()"></app-notifications>
</div>
