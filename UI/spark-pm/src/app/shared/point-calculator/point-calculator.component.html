<div class="pc-wrapper">
	<div class="pc-header">
		<h4>Point Calculator</h4>
		<button class="icon-btn" (click)="close()" aria-label="Close">✕</button>
	</div>
	<form [formGroup]="form" class="pc-form">
		<div class="pc-grid">
			<div class="pc-factor" *ngFor="let f of factors">
				<label>{{ f.label }} <span class="range">{{ getLevelLabel(form.get(f.key)?.value || f.min) }}</span></label>
				<div class="slider-wrapper" [ngClass]="'val-'+(form.get(f.key)?.value || f.min)" [style.--pct]="(((form.get(f.key)?.value || f.min) - f.min) / (f.max - f.min)) * 100">
					<input type="range" [min]="f.min" [max]="f.max" [step]="1" [formControlName]="f.key" />
					<div class="slider-icon" aria-hidden="true">
						<ng-container [ngSwitch]="form.get(f.key)?.value || f.min">
							<svg *ngSwitchCase="1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21c.5-4.5 2.5-8 7-10 2-1 4-2.5 5-5-3 .5-5 1.5-7 3C7 12 6 16 5 21Z"/><path d="M19 21c-.4-3.2-1.6-5.9-3.5-8"/></svg>
							<svg *ngSwitchCase="2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
							<svg *ngSwitchCase="3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18"/><path d="M6 5h12l3 7-3 7H6L3 12Z"/></svg>
							<svg *ngSwitchCase="4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 2.82 18a2 2 0 0 0 1.76 3h14.84a2 2 0 0 0 1.76-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
							<svg *ngSwitchCase="5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c2 2.5 3 4.5 3 6a3 3 0 0 1-6 0c0-1.5 1-3.5 3-6Z"/><path d="M6 14c0 4 3 7 6 7s6-3 6-7c0-2-1-4-3-6"/></svg>
						</ng-container>
					</div>
				</div>
				<div class="pc-scale">
					<span *ngFor="let n of [].constructor(f.max - f.min + 1); let i = index" 
						[class.active]="(i + f.min) == form.get(f.key)?.value"
						[class.level-1]="(i + f.min)===1"
						[class.level-2]="(i + f.min)===2"
						[class.level-3]="(i + f.min)===3"
						[class.level-4]="(i + f.min)===4"
						[class.level-5]="(i + f.min)===5"
						>
						{{ getLevelLabel(i + f.min) }}
					</span>
				</div>
				<small class="help" *ngIf="f.help">{{ f.help }}</small>
			</div>
		</div>
		<div class="legend">
			<span class="badge level-1">Minimal</span>
			<span class="badge level-2">Low</span>
			<span class="badge level-3">Moderate</span>
			<span class="badge level-4">High</span>
			<span class="badge level-5">Very High</span>
		</div>
	</form>
	<div class="pc-summary">
		<div class="agg">
			<div class="label">Weighted Score</div>
			<div class="value">{{ aggregate }}<span class="unit">%</span></div>
		</div>
		<div class="points">
			<div class="label">Story Points</div>
			<div class="value highlight">{{ storyPoints }}</div>
		</div>
	</div>
	<div class="pc-actions">
		<button type="button" class="btn ghost" (click)="resetDefaults()">Reset</button>
		<div class="grow"></div>
		<button type="button" class="btn secondary" (click)="close()">Cancel</button>
		<button type="button" class="btn primary" (click)="confirm()">Apply</button>
	</div>
</div>
